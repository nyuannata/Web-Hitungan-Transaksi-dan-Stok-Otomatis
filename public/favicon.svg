<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="20" fill="#dc2626"/>
  <defs>
    <filter id="fav-wavy">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.04" numOctaves="2" result="warp"/>
      <feDisplacementMap xChannelSelector="R" yChannelSelector="G" scale="5" in="SourceGraphic" in2="warp"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Titan+One&amp;display=swap');
      .fav-text {
        font-family: 'Titan One', sans-serif;
        font-size: 55px;
        font-weight: 900;
        fill: #ffffff;
        filter: url(#fav-wavy);
      }
      .fav-sub {
        font-family: 'Titan One', sans-serif;
        font-size: 16px;
        font-weight: 900;
        fill: #fef08a;
        filter: url(#fav-wavy);
      }
    </style>
  </defs>
  <text x="50" y="58" text-anchor="middle" class="fav-text">M</text>
  <text x="50" y="85" text-anchor="middle" class="fav-sub">SP</text>
</svg>